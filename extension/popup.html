<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TechThrust Assistant</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#0b1220; --muted:#5b6475; --line:#e5e7eb; --accent:#0e7fae; --ok:#15803d; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#e5e7eb; --muted:#9ca3af; --line:#1f2937; --accent:#38bdf8; --ok:#4ade80; --warn:#fbbf24; } }
  body { margin:0; width:300px; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
  header img { width:24px; height:24px; } header b { flex:1; } header small { color:var(--muted); }
  main { padding:12px 16px 16px; display:grid; gap:12px; }
  #status { margin:0; font-size:13px; color:var(--warn); } #status[data-ok="true"] { color:var(--ok); }
  label { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  label span small { display:block; color:var(--muted); font-size:12px; }
  input[type=checkbox] { width:36px; height:20px; accent-color:var(--accent); }
  button { font:inherit; border-radius:999px; padding:9px 14px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--fg); }
  #open { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header><img src="icons/icon-48.png" alt=""><b>TechThrust Assistant</b><small id="server"></small></header>
<main>
  <p id="status" role="status">Checking…</p>
  <button id="open" type="button">Open the assistant</button>
  <label><span>Show on <b id="site-name">this site</b><small>Hide it on sites where you don't want it</small></span><input id="here" type="checkbox"></label>
  <label><span>On for all sites<small>Master switch</small></span><input id="everywhere" type="checkbox"></label>
  <button id="settings" type="button">Settings</button>
</main>
<script src="popup.js"></script>
</body>
</html>
